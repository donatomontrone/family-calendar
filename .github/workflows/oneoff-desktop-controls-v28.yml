name: One-off desktop controls V28

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/oneoff-desktop-controls-v28.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine desktop controls
        shell: bash
        env:
          V28_CSS_B64: 
        run: |
          if ! grep -q 'CASA V28 — integrated accessory list + contextual control' src/desktop-room-workspace-v26.css; then
            printf '\n' >> src/desktop-room-workspace-v26.css
            printf '%s' "$V28_CSS_B64" | base64 -d >> src/desktop-room-workspace-v26.css
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop-room-workspace-v26.css
          if ! git diff --cached --quiet; then
            git commit -m 'refine desktop accessory list and contextual control [skip ci]'
            git push
          fi
