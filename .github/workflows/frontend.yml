name: Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Verify Home Assistant bundle
        run: |
          test -s custom_components/family_calendar/frontend/family-calendar-panel.js
          echo "Frontend bundle generated successfully."

      - name: Commit Home Assistant frontend bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/family_calendar/frontend/family-calendar-panel.js
          if git diff --cached --quiet; then
            echo "Frontend bundle is already up to date."
            exit 0
          fi
          git commit -m "build: update Home Assistant frontend bundle [skip ci]"
          git push
