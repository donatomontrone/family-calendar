name: One-off coherent room cards V29

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/oneoff-room-card-coherence-v29.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unify room cards
        shell: bash
        env:
          V29_CSS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('src/desktop-room-workspace-v26.css')
          s = p.read_text()
          marker = '/* CASA V29 — coherent room surfaces */'
          if marker not in s:
              s += '\n' + base64.b64decode(os.environ['V29_CSS_B64']).decode('utf-8')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop-room-workspace-v26.css
          if ! git diff --cached --quiet; then
            git commit -m 'unify desktop room card language [skip ci]'
            git push
          fi
