name: Apply mobile power v36

on:
  push:
    paths:
      - 'scripts/apply-mobile-power-v36.mjs'
      - '.github/workflows/oneoff-mobile-power-v36.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply visible phone power control
        run: node scripts/apply-mobile-power-v36.mjs
      - name: Commit phone power control
        uses: EndBug/add-and-commit@v9
        with:
          add: 'src/HomeView.tsx src/home-mobile-power-v35.css'
          message: 'fix visible phone light power control'
          default_author: github_actions
