name: One-off desktop workspace V26

on:
  push:
    paths:
      - .github/workflows/desktop-workspace-v26.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refactor desktop room workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/HomeView.tsx')
          text = home.read_text()

          old = '''  const [selectedRoom, setSelectedRoom] = useState<string | null>(null);\n  const [favorites, setFavoriteIds] = useState<string[]>([]);'''
          new = '''  const [selectedRoom, setSelectedRoom] = useState<string | null>(null);\n  const [desktopRoomId, setDesktopRoomId] = useState<string | null>(null);\n  const [favorites, setFavoriteIds] = useState<string[]>([]);'''
          if old not in text:
              raise SystemExit('HomeView state anchor not found')
          text = text.replace(old, new, 1)

          old = '''  const selected = selectedRoom ? rooms.find((room) => room.area.area_id === selectedRoom) ?? null : null;\n  const allActionable = useMemo(() => rooms.flatMap((room) => room.controllableIds), [rooms]);'''
          new = '''  const selected = selectedRoom ? rooms.find((room) => room.area.area_id === selectedRoom) ?? null : null;\n  const desktopRoom = rooms.find((room) => room.area.area_id === desktopRoomId) ?? rooms[0] ?? null;\n  const allActionable = useMemo(() => rooms.flatMap((room) => room.controllableIds), [rooms]);'''
          if old not in text:
              raise SystemExit('HomeView derived-state anchor not found')
          text = text.replace(old, new, 1)

          old = '''        <div className="reel-room-grid">\n          {rooms.map((room) => (\n            <RoomCard\n              key={room.area.area_id}\n              hass={hass}\n              room={room}\n              language={language}\n              onClimate={(entityId) => setRoomClimateEntityId(entityId)}\n            />\n          ))}\n        </div>'''
          new = '''        <div className="desktop-room-workspace-v26">\n          <div\n            className="desktop-room-strip-v26"\n            role="tablist"\n            aria-label={language === "it" ? "Seleziona stanza" : "Select room"}\n          >\n            {rooms.map((room) => {\n              const activeCount = room.controllableIds.filter((id) => isActive(hass, id)).length;\n              const isSelected = desktopRoom?.area.area_id === room.area.area_id;\n              return (\n                <button\n                  key={room.area.area_id}\n                  type="button"\n                  role="tab"\n                  aria-selected={isSelected}\n                  className={isSelected ? "active" : ""}\n                  onClick={() => setDesktopRoomId(room.area.area_id)}\n                >\n                  <span className="desktop-room-tab-icon-v26">{roomIcon(room.area.name)}</span>\n                  <span className="desktop-room-tab-copy-v26">\n                    <strong>{room.area.name}</strong>\n                    <small>{activeCount > 0 ? `${activeCount} ${language === "it" ? "attivi" : "active"}` : (language === "it" ? "Tutto spento" : "All off")}</small>\n                  </span>\n                  <b>{typeof room.temperature === "number" ? `${room.temperature.toFixed(1)}°` : "—"}</b>\n                </button>\n              );\n            })}\n          </div>\n\n          <div className="desktop-room-stage-v26">\n            {desktopRoom && (\n              <RoomCard\n                key={`desktop-${desktopRoom.area.area_id}`}\n                hass={hass}\n                room={desktopRoom}\n                language={language}\n                onClimate={(entityId) => setRoomClimateEntityId(entityId)}\n              />\n            )}\n          </div>\n        </div>\n\n        <div className="reel-room-grid mobile-room-grid-v26">\n          {rooms.map((room) => (\n            <RoomCard\n              key={room.area.area_id}\n              hass={hass}\n              room={room}\n              language={language}\n              onClimate={(entityId) => setRoomClimateEntityId(entityId)}\n            />\n          ))}\n        </div>'''
          if old not in text:
              raise SystemExit('HomeView room-grid anchor not found')
          text = text.replace(old, new, 1)
          home.write_text(text)

          ui = Path('src/ui-interactions.ts')
          text = ui.read_text()
          anchor = 'import homeDesktopRoomInfoV24Styles from "./home-desktop-room-info-v24.css?inline";'
          if 'desktopRoomWorkspaceV26Styles' not in text:
              if anchor not in text:
                  raise SystemExit('ui-interactions import anchor not found')
              text = text.replace(anchor, anchor + '\nimport desktopRoomWorkspaceV26Styles from "./desktop-room-workspace-v26.css?inline";', 1)
          text = text.replace('${homeDesktopRoomInfoV24Styles}`;', '${homeDesktopRoomInfoV24Styles}\\n${desktopRoomWorkspaceV26Styles}`;', 1)
          text = text.replace('target.closest<HTMLElement>(".room-chip-strip")', 'target.closest<HTMLElement>(".room-chip-strip, .desktop-room-strip-v26")')
          ui.write_text(text)

          panel = Path('src/panel.tsx')
          text = panel.read_text()
          anchor = 'import homeDesktopRoomInfoV24Styles from "./home-desktop-room-info-v24.css?inline";'
          if 'desktopRoomWorkspaceV26Styles' not in text:
              if anchor not in text:
                  raise SystemExit('panel import anchor not found')
              text = text.replace(anchor, anchor + '\nimport desktopRoomWorkspaceV26Styles from "./desktop-room-workspace-v26.css?inline";', 1)
          text = text.replace('${homeDesktopRoomInfoV24Styles}`;', '${homeDesktopRoomInfoV24Styles}\\n${desktopRoomWorkspaceV26Styles}`;', 1)
          panel.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          anchor = '    <link rel="stylesheet" href="/src/home-desktop-room-info-v24.css" />'
          if '/src/desktop-room-workspace-v26.css' not in text:
              if anchor not in text:
                  raise SystemExit('index anchor not found')
              text = text.replace(anchor, anchor + '\n    <link rel="stylesheet" href="/src/desktop-room-workspace-v26.css" />', 1)
          index.write_text(text)
          PY

          cat > src/desktop-room-workspace-v26.css <<'CSS'
          /* CASA V26 — desktop room strip + single-room workspace.
           * Phone remains on the already-approved multi-card layout. */

          @media (min-width: 701px) {
            main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard {
              grid-template-columns: minmax(0, 1fr) clamp(300px, 22vw, 350px) !important;
              gap: 16px !important;
              align-items: start !important;
            }

            .app-shell.home-page-active .mobile-room-grid-v26 {
              display: none !important;
            }

            .app-shell.home-page-active .desktop-room-workspace-v26 {
              min-width: 0 !important;
              height: auto !important;
              min-height: 0 !important;
              display: grid !important;
              grid-template-rows: 62px auto !important;
              gap: 12px !important;
              align-content: start !important;
              overflow: visible !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26 {
              width: 100% !important;
              min-width: 0 !important;
              height: 62px !important;
              display: flex !important;
              align-items: stretch !important;
              gap: 7px !important;
              padding: 1px 16px 2px 1px !important;
              overflow-x: auto !important;
              overflow-y: hidden !important;
              scrollbar-width: none !important;
              -ms-overflow-style: none !important;
              overscroll-behavior-x: contain !important;
              scroll-behavior: smooth !important;
              cursor: grab !important;
              mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 22px), transparent 100%) !important;
              -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 22px), transparent 100%) !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26::-webkit-scrollbar {
              display: none !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26.is-horizontal-dragging {
              cursor: grabbing !important;
              scroll-behavior: auto !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26 > button {
              --room-tab-accent: #4f8cff;
              flex: 0 0 clamp(132px, 11vw, 154px) !important;
              min-width: 0 !important;
              height: 58px !important;
              padding: 7px 9px !important;
              display: grid !important;
              grid-template-columns: 30px minmax(0, 1fr) auto !important;
              align-items: center !important;
              gap: 7px !important;
              border: 1px solid var(--home-border, rgba(60,60,67,.10)) !important;
              border-top: 3px solid var(--room-tab-accent) !important;
              border-radius: 16px !important;
              background: color-mix(in srgb, var(--room-tab-accent) 5%, var(--home-card, rgba(255,255,255,.82))) !important;
              color: var(--home-label, #1d1d1f) !important;
              box-shadow: inset 0 1px 0 rgba(255,255,255,.54) !important;
              text-align: left !important;
              cursor: pointer !important;
              transition: border-color .16s ease, background .16s ease, box-shadow .16s ease !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 1) { --room-tab-accent: #4f8cff; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 2) { --room-tab-accent: #34c759; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 3) { --room-tab-accent: #30b0c7; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 4) { --room-tab-accent: #ff9f0a; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 5) { --room-tab-accent: #8e7dff; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n + 6) { --room-tab-accent: #ff6482; }
            .app-shell.home-page-active .desktop-room-strip-v26 > button:nth-child(7n) { --room-tab-accent: #32ade6; }

            .app-shell.home-page-active .desktop-room-strip-v26 > button.active {
              border-color: color-mix(in srgb, var(--room-tab-accent) 42%, var(--home-border, rgba(60,60,67,.10))) !important;
              border-top-color: var(--room-tab-accent) !important;
              background: color-mix(in srgb, var(--room-tab-accent) 13%, var(--home-card-strong, rgba(255,255,255,.94))) !important;
              box-shadow: 0 0 0 2px color-mix(in srgb, var(--room-tab-accent) 10%, transparent), inset 0 1px 0 rgba(255,255,255,.66) !important;
            }

            .app-shell.home-page-active .desktop-room-tab-icon-v26 {
              width: 30px !important;
              height: 30px !important;
              display: grid !important;
              place-items: center !important;
              border-radius: 10px !important;
              background: color-mix(in srgb, var(--room-tab-accent) 13%, transparent) !important;
              color: var(--room-tab-accent) !important;
            }

            .app-shell.home-page-active .desktop-room-tab-icon-v26 svg {
              width: 15px !important;
              height: 15px !important;
            }

            .app-shell.home-page-active .desktop-room-tab-copy-v26 {
              min-width: 0 !important;
              display: flex !important;
              flex-direction: column !important;
              gap: 2px !important;
            }

            .app-shell.home-page-active .desktop-room-tab-copy-v26 strong,
            .app-shell.home-page-active .desktop-room-tab-copy-v26 small {
              min-width: 0 !important;
              overflow: hidden !important;
              text-overflow: ellipsis !important;
              white-space: nowrap !important;
            }

            .app-shell.home-page-active .desktop-room-tab-copy-v26 strong {
              font-size: 11px !important;
              line-height: 1.05 !important;
              font-weight: 680 !important;
            }

            .app-shell.home-page-active .desktop-room-tab-copy-v26 small {
              color: var(--home-secondary, #6e6e73) !important;
              font-size: 8.5px !important;
              line-height: 1.05 !important;
              font-weight: 540 !important;
            }

            .app-shell.home-page-active .desktop-room-strip-v26 > button > b {
              margin: 0 !important;
              color: var(--home-secondary, #6e6e73) !important;
              font-size: 13px !important;
              line-height: 1 !important;
              font-weight: 600 !important;
              font-variant-numeric: tabular-nums !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 {
              min-width: 0 !important;
              min-height: 0 !important;
              height: auto !important;
              overflow: visible !important;
            }

            /* The room itself is a workspace, not another giant outer card. */
            .app-shell.home-page-active .desktop-room-stage-v26 > .reel-room.room-card-v4 {
              width: 100% !important;
              height: auto !important;
              min-height: 0 !important;
              max-height: none !important;
              padding: 0 !important;
              display: grid !important;
              grid-template-columns: minmax(0, 1.08fr) minmax(230px, .82fr) minmax(0, 1fr) !important;
              grid-template-rows: 50px auto !important;
              grid-template-areas:
                "head head head"
                "controls quick status" !important;
              gap: 12px !important;
              align-items: start !important;
              border: 0 !important;
              border-radius: 0 !important;
              background: transparent !important;
              box-shadow: none !important;
              backdrop-filter: none !important;
              -webkit-backdrop-filter: none !important;
              overflow: visible !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-head-v4 {
              grid-area: head !important;
              height: 50px !important;
              min-height: 50px !important;
              padding: 0 4px 8px !important;
              border-bottom: 1px solid var(--home-border-soft, rgba(60,60,67,.07)) !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-device-active-section,
            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-section-v4,
            .app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-v4 {
              min-width: 0 !important;
              margin: 0 !important;
              padding: 13px !important;
              border: 1px solid var(--home-border, rgba(60,60,67,.10)) !important;
              border-radius: 20px !important;
              background: var(--home-card, rgba(255,255,255,.82)) !important;
              box-shadow: 0 7px 24px rgba(0,0,0,.035), inset 0 1px 0 rgba(255,255,255,.62) !important;
              backdrop-filter: blur(22px) saturate(135%) !important;
              -webkit-backdrop-filter: blur(22px) saturate(135%) !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-device-active-section {
              grid-area: controls !important;
              align-self: start !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-v4 {
              grid-area: quick !important;
              width: 100% !important;
              height: auto !important;
              min-height: 112px !important;
              max-height: none !important;
              align-self: start !important;
              box-sizing: border-box !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-section-v4 {
              grid-area: status !important;
              height: auto !important;
              min-height: 0 !important;
              align-self: start !important;
              display: block !important;
              overflow: visible !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-card-v4:not(:has(.room-quick-control-v4)) .room-passive-section-v4 {
              grid-column: 2 / -1 !important;
            }

            /* Keep device tiles compact: the new workspace must not stretch them. */
            .app-shell.home-page-active .desktop-room-stage-v26 .room-device-grid-v4 {
              width: 100% !important;
              display: grid !important;
              grid-template-columns: repeat(auto-fill, minmax(118px, 132px)) !important;
              grid-auto-rows: 48px !important;
              justify-content: start !important;
              gap: 6px !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-device-button-v4 {
              width: 100% !important;
              height: 48px !important;
              min-height: 48px !important;
              max-height: 48px !important;
              padding: 6px 7px !important;
              grid-template-columns: 28px minmax(0, 1fr) !important;
              gap: 6px !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-grid-v4 {
              width: 100% !important;
              height: auto !important;
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              grid-template-rows: none !important;
              grid-auto-rows: minmax(36px, auto) !important;
              gap: 6px !important;
              align-content: start !important;
              overflow: visible !important;
            }

            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-grid-v4 > .room-passive-device-v4,
            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-grid-v4 > .room-passive-device-v4:nth-child(n + 3),
            .app-shell.home-page-active .desktop-room-stage-v26 .room-passive-grid-v4 > .room-passive-device-v4:nth-child(n + 5) {
              width: 100% !important;
              min-height: 36px !important;
              height: auto !important;
              padding: 5px 7px !important;
            }

            .app-shell.home-page-active .reel-side {
              height: auto !important;
              min-height: 0 !important;
              max-height: none !important;
              align-self: start !important;
              overflow: visible !important;
            }

            .app-shell.home-page-active.night .desktop-room-stage-v26 .room-device-active-section,
            .app-shell.home-page-active.night .desktop-room-stage-v26 .room-passive-section-v4,
            .app-shell.home-page-active.night .desktop-room-stage-v26 .room-quick-control-v4 {
              box-shadow: 0 9px 28px rgba(0,0,0,.19), inset 0 1px 0 rgba(255,255,255,.035) !important;
            }
          }

          @media (max-width: 700px), (max-height: 520px) and (max-width: 940px) {
            .app-shell.home-page-active .desktop-room-workspace-v26 {
              display: none !important;
            }

            .app-shell.home-page-active .mobile-room-grid-v26 {
              display: grid !important;
            }
          }
          CSS

      - name: Type-check and build
        run: |
          npm ci
          npm run build:demo
          npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HomeView.tsx src/ui-interactions.ts src/panel.tsx index.html src/desktop-room-workspace-v26.css
          git commit -m "refactor: use desktop room workspace" || exit 0
          git push origin HEAD:master
