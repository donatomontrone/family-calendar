name: One-off desktop controls V28

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/oneoff-desktop-controls-v28.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine desktop controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/desktop-room-workspace-v26.css')
          s = p.read_text()
          marker = '/* CASA V28 — integrated accessory list + contextual control */'
          if marker not in s:
              s += r'''

/* CASA V28 — integrated accessory list + contextual control */
@media (min-width: 701px) {
  /* Keep the selected-room workspace calm: Controls and its contextual range
   * read as one surface, while Sensors & status remains the secondary column. */
  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 > .desktop-room-stage-v26 > .reel-room.room-card-v4 {
    grid-template-columns: minmax(0, 1.5fr) minmax(280px, .70fr) !important;
    grid-template-rows: 50px auto auto !important;
    grid-template-areas:
      "head head"
      "controls status"
      "quick status" !important;
    column-gap: 12px !important;
    row-gap: 0 !important;
  }

  /* One continuous left-hand surface. */
  main.app-shell.home-page-active .desktop-room-stage-v26 .room-device-active-section {
    padding: 12px 12px 10px !important;
    border: 1px solid var(--home-border, rgba(60,60,67,.10)) !important;
    border-bottom: 0 !important;
    border-radius: 20px 20px 0 0 !important;
    background: var(--home-card, rgba(255,255,255,.82)) !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-device-grid-v4 {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    grid-auto-rows: 52px !important;
    column-gap: 14px !important;
    row-gap: 8px !important;
    align-items: stretch !important;
  }

  /* Accessory rows: no floating mini-cards, no shadows, no overlap. */
  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4 {
    box-sizing: border-box !important;
    position: relative !important;
    isolation: isolate !important;
    width: 100% !important;
    height: 52px !important;
    min-height: 52px !important;
    max-height: 52px !important;
    margin: 0 !important;
    padding: 6px 9px !important;
    grid-template-columns: 32px minmax(0, 1fr) !important;
    gap: 9px !important;
    border: 0 !important;
    border-radius: 10px !important;
    background: rgba(118,118,128,.035) !important;
    background-image: none !important;
    box-shadow: none !important;
    outline: 0 !important;
    transform: none !important;
    filter: none !important;
    overflow: hidden !important;
  }

  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4 > span {
    width: 32px !important;
    height: 32px !important;
    min-width: 32px !important;
    border: 0 !important;
    border-radius: 9px !important;
    background: color-mix(in srgb, var(--room-shared-accent) 11%, var(--home-card-strong, rgba(255,255,255,.94))) !important;
    background-image: none !important;
    color: var(--room-shared-accent) !important;
    box-shadow: none !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4 > span svg,
  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4 > span svg * {
    width: 15px !important;
    height: 15px !important;
    color: var(--room-shared-accent) !important;
    fill: currentColor !important;
    stroke: currentColor !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4 strong {
    font-size: 10.5px !important;
    line-height: 1.05 !important;
    font-weight: 660 !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4 small {
    margin-top: 1px !important;
    font-size: 8.5px !important;
    line-height: 1 !important;
    font-weight: 540 !important;
  }

  /* Active state is communicated by a restrained room-colour rail plus the
   * icon, not by filling the entire accessory with a domain colour. */
  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4.active {
    background: color-mix(in srgb, var(--room-shared-accent) 6%, rgba(118,118,128,.035)) !important;
    box-shadow: inset 3px 0 0 var(--room-shared-accent) !important;
  }

  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4.active > span {
    border: 0 !important;
    background: var(--room-shared-accent) !important;
    color: #fff !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4.active > span svg,
  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4.active > span svg * {
    color: #fff !important;
    fill: currentColor !important;
    stroke: currentColor !important;
  }

  main.app-shell.home-page-active > .reel-home.home-refactor-v4 > .reel-dashboard > .desktop-room-workspace-v26 .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4.selected {
    background: color-mix(in srgb, var(--room-shared-accent) 9%, rgba(118,118,128,.035)) !important;
    box-shadow: inset 3px 0 0 var(--room-shared-accent), inset 0 0 0 1px color-mix(in srgb, var(--room-shared-accent) 20%, transparent) !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 button.room-device-button-v4:hover:not(:disabled) {
    background: color-mix(in srgb, var(--room-shared-accent) 5%, rgba(118,118,128,.065)) !important;
    transform: none !important;
  }

  /* Contextual control is part of the Controls surface, not a repeated card. */
  main.app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-v4 {
    min-height: 88px !important;
    margin: 0 !important;
    padding: 10px 12px 13px !important;
    border: 1px solid var(--home-border, rgba(60,60,67,.10)) !important;
    border-top: 1px solid var(--home-border-soft, rgba(60,60,67,.07)) !important;
    border-radius: 0 0 20px 20px !important;
    background: var(--home-card, rgba(255,255,255,.82)) !important;
    box-shadow: none !important;
    backdrop-filter: blur(22px) saturate(135%) !important;
    -webkit-backdrop-filter: blur(22px) saturate(135%) !important;
  }

  /* Device name is already visible and selected above. Avoid repeating it. */
  main.app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-head > div > small {
    display: none !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-head {
    min-height: 30px !important;
    margin: 0 0 8px !important;
    align-items: center !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-head > div > strong {
    display: flex !important;
    align-items: baseline !important;
    gap: 8px !important;
    font-size: 11px !important;
    line-height: 1 !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-quick-control-head > div > strong > b {
    margin-left: 0 !important;
    color: var(--room-shared-accent) !important;
    font-size: 13px !important;
    font-variant-numeric: tabular-nums !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-light-mode-v4 {
    gap: 5px !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-light-mode-v4 > button {
    width: 28px !important;
    height: 28px !important;
    min-width: 28px !important;
    min-height: 28px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 1px solid var(--home-border-soft, rgba(60,60,67,.08)) !important;
    border-radius: 9px !important;
    background: rgba(118,118,128,.055) !important;
    color: var(--home-secondary, #6e6e73) !important;
    box-shadow: none !important;
    transform: none !important;
  }

  main.app-shell.home-page-active .desktop-room-stage-v26 .room-light-mode-v4 > button.active {
    border-color: color-mix(in srgb, var(--room-shared-accent) 42%, transparent) !important;
    background: color-mix(in srgb, var(--room-shared-accent) 14%, transparent) !important;
    color: var(--room-shared-accent) !important;
  }

  /* Rooms without an editable light/cover still get a complete Controls card. */
  main.app-shell.home-page-active .desktop-room-stage-v26 .room-card-v4:not(:has(.room-quick-control-v4)) .room-device-active-section {
    border-bottom: 1px solid var(--home-border, rgba(60,60,67,.10)) !important;
    border-radius: 20px !important;
  }

  main.app-shell.home-page-active.night .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4 {
    background: rgba(118,118,128,.08) !important;
  }

  main.app-shell.home-page-active.night .desktop-room-stage-v26 button.room-device-button-v4.room-device-button-v4.active {
    background: color-mix(in srgb, var(--room-shared-accent) 8%, rgba(118,118,128,.10)) !important;
  }
}
'''
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop-room-workspace-v26.css
          if ! git diff --cached --quiet; then
            git commit -m 'refine desktop accessory list and contextual control [skip ci]'
            git push
          fi
