name: Release

on:
  push:
    branches: [master]
    paths:
      - custom_components/family_calendar/manifest.json
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - docs/DEVELOPMENT.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'donatomontrone/family-calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify committed Home Assistant bundle
        shell: bash
        run: |
          BUNDLE="custom_components/family_calendar/frontend/family-calendar-panel.js"
          test -s "$BUNDLE"
          if ! git diff --quiet -- "$BUNDLE"; then
            echo "The committed Home Assistant frontend bundle is stale."
            echo "Wait for the Frontend workflow to commit the generated bundle, then rerun the release."
            git diff --stat -- "$BUNDLE"
            exit 1
          fi
          echo "Committed frontend bundle matches the current sources."

      - name: Verify release version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' custom_components/family_calendar/manifest.json)"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          LOCK_VERSION="$(jq -r '.version' package-lock.json)"
          LOCK_ROOT_VERSION="$(jq -r '.packages[""].version' package-lock.json)"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version '$VERSION' is not a stable semantic version."
            exit 1
          fi

          for VALUE in "$PACKAGE_VERSION" "$LOCK_VERSION" "$LOCK_ROOT_VERSION"; do
            if [ "$VALUE" != "$VERSION" ]; then
              echo "Release version mismatch: manifest=$VERSION package=$PACKAGE_VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION"
              exit 1
            fi
          done

          grep -F "Current release: **v$VERSION**" README.md >/dev/null
          grep -F "Versione corrente: **v$VERSION**" ROADMAP.md >/dev/null
          grep -F "Current version: **v$VERSION**" ROADMAP.md >/dev/null
          grep -F "Versione corrente: **$VERSION**" docs/DEVELOPMENT.md >/dev/null
          grep -F "Current version: **$VERSION**" docs/DEVELOPMENT.md >/dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1 }
            capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION."
            exit 1
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Family Calendar ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
