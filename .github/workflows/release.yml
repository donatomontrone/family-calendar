name: Release 1.0.0

on:
  push:
    branches: [master]
    paths:
      - custom_components/family_calendar/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'donatomontrone/family-calendar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' custom_components/family_calendar/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "1.0.0" ]; then
            echo "This workflow only publishes v1.0.0; current version is $VERSION."
            exit 1
          fi

      - name: Prepare release notes
        shell: bash
        run: sed -n '/^## \[1\.0\.0\]/,$p' CHANGELOG.md > release-notes.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Family Calendar ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
